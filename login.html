<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | ALTER</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <header>
        <nav class="navegacion">
            <a href="index.html" class="logo">ALTER</a>

            <a href="index.html" class="btn-volver">Volver al inicio</a>
        </nav>
    </header>

    <main>
        <section class="inicio-sesion">
            <h1>Bienvenido de nuevo</h1>
            <p>Inicia sesión para continuar.</p>

            <form id="formulario-login">
                <label for="correo">Correo electrónico</label>
                <input 
                    type="email" 
                    id="correo"
                    name="correo"
                    placeholder="ingresa tu correo"
                    required>

                <label for="contrasena">Contraseña</label>
                <input 
                    type="password" 
                    id="contrasena"
                    name="contrasena"
                    placeholder="ingresa tu contraseña"
                    required>

                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
                <button type="submit">Iniciar sesión</button>
                <p class="mensaje-formulario" id="mensaje-login" aria-live="polite"></p>
            </form>
            <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </section>
    </main>

<script src="js/script.js"></script>
</body>
</html>
