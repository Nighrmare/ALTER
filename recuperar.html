<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | ALTER</title>
        <link rel="stylesheet" href="css/style.css">
</head>
<body>
        <header>
        <nav class="navegacion">
            <a href="index.html" class="logo">ALTER</a>
            <A href="login.html" class="btn-volver">Volver a iniciar sesión</A>
        </nav>
    </header>

    <main>
        <section class="inicio-sesion">
            <h1>Recuperar contraseña</h1>
            <p>Ingresa tu correo electrónico para recuperar el acceso a tu cuenta.</p>

            <form>
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingresa tu correo"
                    required>

                <button type="submit">Recuperar contraseña</button>
            </form>
            <p><a href="login.html">Volver al inicio de sesión</a></p>
        </section>
    </main>

<script src="js/script.js"></script>

</body>
</html>
